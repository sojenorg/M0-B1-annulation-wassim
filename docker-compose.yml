services:
  api:
    build: .
    image: fastia-annulation:dev
    ports:
      - "8001:8001"

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    image: fastia-annulation-ui:dev
    ports:
      - "8501:8501"
    environment:
      API_URL: http://api:8001
    depends_on:
      api:
        condition: service_healthy
